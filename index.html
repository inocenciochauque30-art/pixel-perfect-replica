<style>
:root{--black:#111;--panel:#1e1e1e;--gold:#d4af37;--cream:#f5eedd;--white:#fff;--line:rgba(212,175,55,.42)}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--black)}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#29251b 0,#111 52%);color:var(--cream);font-family:'DM Sans',Arial,sans-serif;min-height:100vh}
.welcome-shell{padding:12px;background:#111}.welcome-frame{position:relative;max-width:1120px;margin:auto;text-align:center;padding:34px 18px 31px;border:1px solid rgba(245,238,221,.78);outline:1px solid rgba(245,238,221,.16);outline-offset:5px;background:radial-gradient(ellipse at 50% 0%,#302b20 0,#111 72%);animation:welcomeIn 1.15s cubic-bezier(.2,.75,.25,1) both}
@keyframes welcomeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.logo-mark{width:112px;height:112px;margin:0 auto 9px;display:block}.brand-name{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(42px,8vw,66px);line-height:.9;color:#fff;margin:0}.brand-sub{font-size:10px;letter-spacing:4px;color:var(--cream);margin:10px 0 24px}
.welcome-title{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(31px,6.5vw,54px);line-height:1.05;color:var(--cream);margin:0 auto 10px;max-width:850px}.welcome-sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(19px,3.8vw,25px);color:var(--gold);margin:0}.gold-rule{height:1px;width:min(180px,45%);background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto 0}
.prato{max-width:1120px;margin:18px auto 0;text-align:center;padding:16px 12px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);background:linear-gradient(90deg,transparent,rgba(212,175,55,.09),transparent)}.prato strong{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(24px,5vw,34px);font-weight:700;color:var(--gold)}.prato span{display:block;color:var(--cream);font-size:15px;margin-top:3px}
.sticky{position:sticky;top:0;z-index:10;background:rgba(17,17,17,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);border-bottom:1px solid var(--gold);padding:13px 14px}.tabs{display:flex;gap:10px;max-width:760px;margin:auto}
.tab{flex:1;border:1px solid var(--gold);border-radius:8px;background:#1e1e1e;color:var(--cream);font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(20px,4vw,27px);font-weight:700;padding:11px 8px;cursor:pointer;min-height:52px}.tab.active{background:var(--gold);color:#17140d;box-shadow:0 4px 15px #0007}
.search-wrap{max-width:760px;margin:12px auto 0;position:relative;display:flex;align-items:center}#search{width:100%;min-width:0;min-height:48px;background:#1e1e1e;border:1px solid #8f783b;border-radius:8px;color:var(--cream);padding:11px 85px 11px 14px;font:500 16px 'DM Sans',Arial,sans-serif;outline:none}#search:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d4af3724}#search::placeholder{color:#b8ad94}
.clear-search{position:absolute;right:7px;top:6px;min-height:35px;padding:5px 11px;border:1px solid var(--gold);border-radius:6px;background:#29251b;color:var(--cream);font:600 13px Arial,sans-serif;cursor:pointer}.clear-search[hidden]{display:none}
main{max-width:1120px;margin:0 auto;padding:22px 16px 48px}.menu-panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start;animation:fade .4s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.category{margin:0;padding:19px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#24231f,#191919 70%);box-shadow:0 12px 28px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.025)}.category-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--gold);padding-bottom:9px;margin-bottom:8px}.category-icon{color:var(--gold);font-size:19px}.category h2{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(27px,4vw,35px);line-height:1;color:var(--cream);margin:0}
.dish{display:flex;align-items:baseline;gap:7px;padding:9px 2px;border-bottom:1px dotted rgba(212,175,55,.19)}.dish:last-child{border-bottom:0}.dish-name{font-size:clamp(14px,2vw,16px);line-height:1.4;color:var(--cream);font-weight:500}.dots{flex:1;min-width:8px;border-bottom:1px dotted #9e8b5a;transform:translateY(-4px);opacity:.72}.price{white-space:nowrap;border:1px solid #a88e42;border-radius:30px;padding:4px 10px;color:var(--gold);font-size:clamp(13px,1.8vw,15px);font-weight:600;background:#171614;display:inline-flex;align-items:center;min-height:28px}
.empty{grid-column:1/-1;color:var(--cream);text-align:center;padding:40px 8px;font-family:'Cormorant Garamond',serif;font-size:25px}
footer{max-width:1120px;margin:0 auto 16px;text-align:center;background:#171614;color:var(--cream);padding:26px 15px 30px;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;border:1px solid var(--line);border-radius:12px}footer small{display:block;color:var(--gold);font:10px 'DM Sans',Arial,sans-serif;letter-spacing:3px;margin-top:9px}
@media(max-width:680px){.menu-panel{grid-template-columns:1fr;gap:13px}main{padding:16px 12px 34px}.category{padding:16px 15px}.welcome-frame{padding:28px 13px 25px}.logo-mark{width:96px;height:96px}.brand-sub{margin-bottom:19px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style></head>

<svg class="logo-mark" viewBox="0 0 120 120" role="img" aria-label="Símbolo Mangueira com árvore e copo de vinho"><circle cx="60" cy="60" r="53" fill="none" stroke="#fff" stroke-width="4"/><circle cx="60" cy="60" r="46" fill="none" stroke="#fff" stroke-width="1" opacity=".55"/><path d="M60 86V46M60 54C48 49 39 39 39 29c12 0 21 7 21 18M60 48c2-15 12-24 25-25 0 13-9 24-25 28M60 65C48 57 36 58 29 66c10 11 20 13 31 7M60 66c11-10 23-10 31-3-8 12-19 16-31 11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M57 36h10l-1 8c-.4 3-7.6 3-8 0zM62 44v4M48 88h24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
<h1 class="brand-name">Mangueira</h1><p class="brand-sub">RESTAURANTE &amp; BAR</p>
<p class="welcome-title">Bem-vindo ao Mangueira Restaurante &amp; Bar</p><p class="welcome-sub">Temos o prato do dia Das 12h até 15:30</p><div class="gold-rule"></div></header>
<section class="prato" aria-label="Horário do prato do dia"><strong>Prato do Dia</strong><span>Todos os dias · Das 12h até 15:30</span></section></div>
<nav class="sticky" aria-label="Navegação do menu"><div class="tabs"><button class="tab active" data-tab="comidas" aria-pressed="true">COMIDAS</button><button class="tab" data-tab="bebidas" aria-pressed="false">BEBIDAS</button></div><div class="search-wrap"><label class="sr-only" for="search">Pesquisar por produto, categoria ou preço</label><input id="search" type="search" placeholder="Pesquisar no menu..." aria-label="Pesquisar por produto, categoria ou preço" autocomplete="off"><button id="clear-search" class="clear-search" type="button" aria-label="Limpar pesquisa" hidden>Limpar</button></div></nav>
<main><div id="menu" class="menu-panel" aria-live="polite"></div></main>
<footer>Mangueira Restaurante &amp; Bar<small>HOSPITALIDADE · SABOR · TRADIÇÃO</small></footer>
<script>
const menus={
comidas:[
["Entradas","✦",[["4 Chamussas","150"],["Moelas","250"],["Camarão Alhinho","350"],["Cabeças de Lulas","250"],["Tiras de Bifi","300"],["Pão de Alho","150"]]],
["Refeições Leves","❖",[["Codornizes","350"],["Prego no Prato","350"],["Prego no Pão","250"],["Azinhas","250"]]],
["Petiscos","✧",[["Alentejano","350"],["Amêijoa","250"],["Dobrada","250"],["Cabrito","250"],["Mix","250"],["Cabeça de Peixe","300"]]],
["Saladas","❋",[["Salada","100"],["Salada Grega","200"],["Salada de Galinha","200"],["Salada Mista","200"],["Salada Fria","200"]]],
["Grelhados","♨",[["Fillet na Frigideira","700"],["Espetada de Picanha","750"],["Chouriço","450"],["Peixe Inteiro","Por KG"],["Galinha Cafreal","Consultar"]]],
["Carne por kg","♜",[["Porco","Por KG"],["Worse","Por KG"],["Babalaza","Por KG"],["Vaca","Por KG"],["T-Bone","Por KG"]]],

["Frangos","♨",[["Frango Inteiro","800"],["1/2 Frango","450"],["1/4 Frango","300"]]],
["Extra","✧",[["Dose de Batata","100"],["Arroz","100"],["Xima","80"],["Grau de Bico","100"]]]
],
bebidas:[
["Águas","❋",[["Vumba 500ml","50"],["Bonaqua 500ml","40"]]],
["Chá & Café","☕",[["Chá Simples","100"],["Café Expresso","85"],["Expresso Duplo","150"],["Café com Leite","120"],["Café Descafeinado","100"]]],
["Refrescos","✧",[["Garrafa 300ml","50"],["Tónica/Gingerale/Dry Lemon","80"],["Grapetiser/Appletiser","120"],["Red Bull","140"]]],
["Sumos","❋",[["Compal 1L","200"],["Céres 200ml","50"],["Céres 1L","200"],["Santal 500ml","80"],["Santal 1L","200"],["Cappy","80"]]],
["Espumantes","✦",[["Nua Moscato GF","Consultar"],["J.C Normal","1000"],["Tosti 24 Puré","Consultar"],["Moët","Consultar"],["Moscato","Consultar"],["Rich Veuve","Consultar"],["J.C Black","2000"],["Martine Asti","1500"]]],
["Cervejas","♜",[["Manica/2M 500ml","100"],["2M Txoti/Lata","100"],["Lite Lata/Garrafa 330ml","100"],["Lite Txoti","100"],["Castle GF/Lata Double Malte","100"],["Milk Stout/Stella","100"],["Impala Lata","80"],["Manica 550ml GF","100"],["Preta 550ml","100"],["Txilar Lata","80"],["Heineken Lata/Txoti/Zero/Silver","100"],["Corona Lata","150"],["Corona Garrafa","120"]]],
["Cervejas à Pressão","♨",[["Heineken 500ml","200"],["Heineken 350ml","170"],["Heineken 250ml","120"],["Txilar 500ml","150"],["Txilar 350ml","75"]]],
["Cidras","✧",[["Bernini GF","120"],["Bernini Lata","140"],["Breezer/Myfair/Spin","100"],["Flying Fish/Brutal","100"],["Hunters Dry e Gold","100"],["Savana","100"]]],
["Licor Shots","❖",[["Amarula","75"],["Jägermeister","100"],["Kahlúa","100"],["Martini","100"],["Sambuca","100"],["After Shock","100"],["Captain Morgan","75"]]],
["Whisky Shots Simples","♜",[["Jameson Normal","100"],["Jameson Black Barrel","200"],["Jameson Stout Edition","150"],["J.W Red Label","100"],["J.W Black Label","150"],["Glenfiddich","200"],["Jack Daniels","100"]]],
["Vinhos Tintos","🍷",[["Reguengos","700"],["Dom Mamede","650"],["Alandra","700"],["Monte Velho","700"],["5 Elementos","750"],["Nunes Barata","1000"],["Drosty-Hof","650"]]],
["Vinhos Tintos - Seleção","🍷",[["The Chocolate","1750"],["Terra del Campo","1300"],["Ruston Vera","1300"],["Ruppert","1300"],["Groot Constantina","1300"],["Silk Spice","1300"],["Bolota","1300"],["Optima","1300"],["Diermerson Dal","1300"],["Noble Hill","1300"],["Bolota Alentejana","1500"],["Nicho Mas","1500"],["Casa Insua","Consultar"],["Cabriz Reserva","1500"]]],
["Vinhos Tintos, Verdes & Brancos","🍷",[["Muralha","1200"],["Planato","1200"],["Aveleda","900"],["Gatão","900"],["Casal Garcia","900"],["Natural Light","600"],["Gazella","700"]]],
["Vodka - Shots Simples","◈",[["Smirnoff","75"],["Absolut","100"],["Escape","75"]]],
["Bebidas Espirituosas - Gin & Tekila","◈",[["Gin Gordon","75 / 150"],["Gin Tanqueray","100 / 200"],["Gin Bombay","100 / 200"],["Gin Imagin","100 / 200"],["Tekila Chocolate","100 / 200"],["Tekila Repousado Gold","100 / 200"],["Tekila Branca","100 / 200"],["São Domingos","100 / 200"],["Bolato","100 / 200"],["1920","100 / 200"],["Maceira","100 / 200"],["Gin Beefeater","100 / 200"],["Gin Streeton","100 / 200"]]]
]};
let active="comidas";
const menu=document.getElementById("menu"),search=document.getElementById("search"),clearSearch=document.getElementById("clear-search");
const normalizeText=value=>String(value).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase("pt");
const escapeHTML=value=>String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
function render(){
 const q=normalizeText(search.value.trim());let found=0;
 let output=menus[active].map(([title,icon,items])=>{
  const filtered=items.filter(([name,price])=>normalizeText([name,title,price,price==="Consultar"?"Consultar":"",price==="Por KG"?"Por KG":price+" MT"].join(" ")).includes(q));
  if(!filtered.length)return "";found+=filtered.length;
  return '<section class="category"><div class="category-head"><span class="category-icon" aria-hidden="true">'+escapeHTML(icon)+'</span><h2>'+escapeHTML(title)+'</h2></div>'+filtered.map(([name,price])=>'<div class="dish"><span class="dish-name">'+escapeHTML(name)+'</span><span class="dots" aria-hidden="true"></span><span class="price">'+escapeHTML(price==="Consultar"||price==="Por KG"?price:price+" MT")+'</span></div>').join("")+'</section>';
 }).join("");

 menu.innerHTML=found?output:'<div class="empty" role="status">Não encontrámos resultados para esta pesquisa. Experimente outro nome, categoria ou preço.</div>';
 clearSearch.hidden=!search.value;
 menu.querySelectorAll(".gallery img").forEach(img=>img.addEventListener("error",()=>{const fallback=document.createElement("div");fallback.className="gallery-fallback";fallback.setAttribute("role","img");fallback.setAttribute("aria-label","Imagem ilustrativa indisponível");fallback.textContent="✧";img.replaceWith(fallback)},{once:true}));
}
document.querySelectorAll(".tab").forEach(button=>button.addEventListener("click",()=>{active=button.dataset.tab;document.querySelectorAll(".tab").forEach(tab=>{const selected=tab===button;tab.classList.toggle("active",selected);tab.setAttribute("aria-pressed",String(selected))});menu.classList.remove("menu-panel");void menu.offsetWidth;menu.classList.add("menu-panel");render()}));
search.addEventListener("input",render);clearSearch.addEventListener("click",()=>{search.value="";render();search.focus()});render();
</script></body></html>
